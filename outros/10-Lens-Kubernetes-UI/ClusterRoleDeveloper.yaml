apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
  # Componentes em geral do cluster: Visualizar
  - verbs: ["get", "list", "watch"]
    apiGroups: [""]
    resources: ["configmaps", "endpoints", "persistentvolumeclaims", "persistentvolumeclaims/status", "replicationcontrollers", "replicationcontrollers/scale", "serviceaccounts", "services", "services/status", "secrets", "bindings", "events", "limitranges", "namespaces/status", "pods/status", "replicationcontrollers/status", "resourcequotas", "resourcequotas/status", "namespaces"]  # PODs: Matar/Restart, Ver logs
  - verbs: ["get", "list", "watch", "delete", "patch"]
    apiGroups: [""]
    resources: ["pods"]
  - verbs: ["get"]
    apiGroups: [""]
    resources: ["pods/log"]  # Deployments: Visualizar, Editar (alteração de recursos, por exemplo), Editar HPA
  - verbs: ["get", "list", "watch", "update", "patch"]
    apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/status", "replicasets", "replicasets/scale", "replicasets/status", "statefulsets", "statefulsets/scale", "statefulsets/status"]
  - verbs: ["get", "list", "watch", "update", "patch"]
    apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]  # ConfigMaps: Visualizar, Editar, Criar
  - verbs: ["get", "list", "watch", "create", "update", "patch"]
    apiGroups: [""]
    resources: ["configmaps"]  # Secrets: Visualizar, Editar, Criar
  - verbs: ["get", "list", "watch", "create", "update", "patch"]
    apiGroups: [""]
    resources: ["secrets"]  # HPA: Visualizar, Editar
  - verbs: ["get", "list", "watch", "update", "patch"]
    apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["networking.istio.io"]
    resources: ["gateways", "virtualservices"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["apps"]
    resources: ["controllerrevisions", "daemonsets", "daemonsets/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["batch"]
    resources: ["cronjobs", "cronjobs/status", "jobs", "jobs/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["extensions"]
    resources: ["daemonsets", "daemonsets/status", "deployments", "deployments/scale", "deployments/status", "ingresses", "ingresses/status", "networkpolicies", "replicasets", "replicasets/scale", "replicasets/status", "replicationcontrollers/scale"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/status", "networkpolicies"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
