apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: list-namespaces
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
  - verbs: ["get", "list", "watch"]
    apiGroups: [""]
    resources: ["namespaces"]
