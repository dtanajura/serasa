apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: developer
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
  # Permissões de visualização para todos os recursos
  - verbs: ["get", "list", "watch"]
    apiGroups: [""]
    resources: ["configmaps", "endpoints", "persistentvolumeclaims", "persistentvolumeclaims/status", "replicationcontrollers", "replicationcontrollers/scale", "serviceaccounts", "services", "services/status", "secrets", "bindings", "events", "limitranges", "namespaces", "namespaces/status", "pods/status", "pods/log", "replicationcontrollers/status", "resourcequotas", "resourcequotas/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["apps"]
    resources: ["controllerrevisions", "daemonsets", "daemonsets/status", "deployments", "deployments/scale", "deployments/status", "replicasets", "replicasets/scale", "replicasets/status", "statefulsets", "statefulsets/scale", "statefulsets/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["batch"]
    resources: ["cronjobs", "cronjobs/status", "jobs", "jobs/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["extensions"]
    resources: ["daemonsets", "daemonsets/status", "deployments", "deployments/scale", "deployments/status", "ingresses", "ingresses/status", "networkpolicies", "replicasets", "replicasets/scale", "replicasets/status", "replicationcontrollers/scale"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/status", "networkpolicies"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["networking.istio.io"]
    resources: ["gateways", "virtualservices"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ["*"]
    resources: ["*"]

  # Permissões adicionais para configmaps, secrets, namespaces, pods, deployments, replicasets, statefulsets, cronjobs, ingresses
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: [""]
    resources: ["configmaps", "secrets", "namespaces", "pods"]
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: ["batch"]
    resources: ["cronjobs"]
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
  - verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets","secretstores", "clustersecretstores"]
